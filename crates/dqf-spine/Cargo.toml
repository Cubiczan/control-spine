[package]
name = "dqf-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fleet/Logistics control spine: deterministic DOT driver qualification file (DQF) checklist expiry, out-of-service risk flags, and fail-closed evidence packs."
publish = false

[dependencies]
spine = { path = "../spine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
