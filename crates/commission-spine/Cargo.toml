[package]
name = "commission-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sales commission control spine: deterministic commission computation with clawback tracking and fail-closed evidence packs."
publish = false

[dependencies]
spine = { path = "../spine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
