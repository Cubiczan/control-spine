[package]
name = "capa-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Quality/EHS CAPA control spine: deterministic severity, containment, aging, and human-locked closure over nonconformances."
publish = false

[dependencies]
spine = { path = "../spine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2"
