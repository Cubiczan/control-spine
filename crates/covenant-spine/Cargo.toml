[package]
name = "covenant-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Treasury/Finance covenant control spine: deterministic debt-covenant tests, headroom, and breach early-warning evidence packs."
publish = false

[dependencies]
spine = { path = "../spine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
