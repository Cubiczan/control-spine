[package]
name = "ghg-ledger-spine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic Scope 1/2/3 greenhouse-gas inventory engine with factor lineage, dual-method Scope 2, and a restatement-safe append-only ledger (ESG/Sustainability control spine)."
publish = false

[dependencies]
spine = { path = "../spine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
